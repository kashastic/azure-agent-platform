# Argo CD sized for a single small node. On a 2-vCPU AKS node the managed
# add-ons already request about 1.45 vCPU, so CPU requests here are kept
# small; they reserve capacity for scheduling and don't cap usage.
# Anything not set here keeps the chart default.

# No SSO and no notifications in the lab: admin login through port-forward.
dex:
  enabled: false

notifications:
  enabled: false

configs:
  params:
    # TLS is not terminated inside the cluster; the UI is only reached
    # through kubectl port-forward, which is itself authenticated with Entra ID.
    server.insecure: true

controller:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi

server:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
