apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eurag
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: agent-platform
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: apps/eurag/chart
    helm:
      valueFiles:
        - values-dev.yaml
      # Values that come from Azure. Helm parameters take precedence over
      # the value files, so these can't drift from what Terraform built.
      parameters:
        - name: image.repository
          value: {{ .Values.eurag.imageRepository | quote }}
        - name: azure.tenantId
          value: {{ .Values.eurag.tenantId | quote }}
        - name: azure.keyVaultName
          value: {{ .Values.eurag.keyVaultName | quote }}
        - name: azure.workloadIdentityClientId
          value: {{ .Values.eurag.workloadClientId | quote }}
        - name: web.image.repository
          value: {{ .Values.eurag.webImageRepository | quote }}
        - name: corpus.blobUrl
          value: {{ .Values.eurag.corpusBlobUrl | quote }}
        - name: public.hostname
          value: {{ .Values.eurag.publicHostname | quote }}
        {{- if .Values.eurag.publicHostname }}
        # A public deployment must come up with the whole corpus or not at all.
        - name: seed.expectDocs
          value: "47"
        {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.eurag.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        team: platform
        {{- if .Values.eurag.publicHostname }}
        # Lets this namespace attach routes to the public Gateway.
        gateway-access: public
        pod-security.kubernetes.io/enforce: restricted
        {{- else }}
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/warn: restricted
        {{- end }}
        {{- range $key, $value := .Values.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
