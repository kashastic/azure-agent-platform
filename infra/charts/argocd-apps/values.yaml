edge:
  enabled: false
  namespace: edge
  hostname: ""
  staticIpName: ""
  staticIpResourceGroup: ""
  envoyGatewayVersion: v1.9.3
  certManagerVersion: v1.21.2

eurag:
  namespace: eurag
  imageRepository: ""
  webImageRepository: ""
  publicHostname: ""
  corpusBlobUrl: ""
  keyVaultName: ""
  tenantId: ""
  workloadClientId: ""
