{{- if .Values.public.hostname }}
# Same routing as EURAG's Caddyfile: API paths to the backend, everything
# else to the Next.js app, one origin so the browser needs no CORS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eurag
  labels:
    {{- include "eurag.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.public.gateway.name }}
      namespace: {{ .Values.public.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ .Values.public.hostname | quote }}
  rules:
    - matches:
        {{- range list "/query" "/ingest" "/healthz" "/documents" "/auth" "/admin" "/conversations" "/account" }}
        - path:
            type: PathPrefix
            value: {{ . }}
        {{- end }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
            # Don't advertise the framework and version to scanners.
            remove:
              - X-Powered-By
      backendRefs:
        - name: eurag
          port: {{ .Values.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
            # Don't advertise the framework and version to scanners.
            remove:
              - X-Powered-By
      backendRefs:
        - name: eurag-web
          port: 3000
{{- end }}
