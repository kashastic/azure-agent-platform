{{- if .Values.public.hostname }}
# EURAG's Next.js app. It holds no secrets and needs no outbound network:
# the browser calls the API on the same origin through the Gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eurag-web
  labels:
    {{- include "eurag.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "eurag.webSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eurag.webSelector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ required "web.image.repository is required" .Values.web.image.repository }}:{{ required "web.image.tag is required" .Values.web.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "eurag.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eurag-web
  labels:
    {{- include "eurag.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "eurag.webSelector" . | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}
