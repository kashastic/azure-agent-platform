# Secrets Store CSI driver: reads secrets from Key Vault with the workload
# identity and mirrors them into the eurag-secrets Kubernetes Secret, which
# the containers read as environment variables. Nothing secret is in Git.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eurag-keyvault
  labels:
    {{- include "eurag.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.azure.workloadIdentityClientId | quote }}
    keyvaultName: {{ required "azure.keyVaultName is required" .Values.azure.keyVaultName | quote }}
    tenantId: {{ required "azure.tenantId is required" .Values.azure.tenantId | quote }}
    objects: |
      array:
      {{- range (include "eurag.secrets" . | fromYamlArray) }}
        - |
          objectName: {{ .keyVaultSecret }}
          objectType: secret
          objectAlias: {{ .envName }}
      {{- end }}
  secretObjects:
    - secretName: eurag-secrets
      type: Opaque
      data:
        {{- range (include "eurag.secrets" . | fromYamlArray) }}
        - objectName: {{ .envName }}
          key: {{ .envName }}
        {{- end }}
    {{- if .Values.public.hostname }}
    # Postgres and Redis get only their own password, not the API's keys.
    - secretName: eurag-postgres
      type: Opaque
      data:
        - objectName: POSTGRES_PASSWORD
          key: POSTGRES_PASSWORD
    - secretName: eurag-redis
      type: Opaque
      data:
        - objectName: REDIS_PASSWORD
          key: REDIS_PASSWORD
    {{- end }}
