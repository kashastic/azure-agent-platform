apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "eurag.labels" . | nindent 4 }}
  annotations:
    # The Entra ID identity this service account may act as (workload identity).
    azure.workload.identity/client-id: {{ required "azure.workloadIdentityClientId is required" .Values.azure.workloadIdentityClientId | quote }}
# EURAG never calls the Kubernetes API.
automountServiceAccountToken: false
