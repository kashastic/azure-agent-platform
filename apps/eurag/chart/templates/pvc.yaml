apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eurag-state
  labels:
    {{- include "eurag.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
