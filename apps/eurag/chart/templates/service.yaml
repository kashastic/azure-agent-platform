apiVersion: v1
kind: Service
metadata:
  name: eurag
  labels:
    {{- include "eurag.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Internal only. Reached through kubectl port-forward, which requires an
  # Entra ID sign-in; a public ingress is a deliberate next step, not a default.
  type: ClusterIP
  selector:
    {{- include "eurag.apiSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
