apiVersion: v1
kind: Service
metadata:
  name: eurag-qdrant
  labels:
    {{- include "eurag.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  type: ClusterIP
  selector:
    {{- include "eurag.qdrantSelector" . | nindent 4 }}
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: eurag-qdrant-headless
  labels:
    {{- include "eurag.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  clusterIP: None
  selector:
    {{- include "eurag.qdrantSelector" . | nindent 4 }}
  ports:
    - name: http
      port: 6333
      targetPort: http
---
# Vector store as a StatefulSet: a stable identity and its own disk that
# survives pod restarts. One replica; Qdrant clustering is out of scope.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eurag-qdrant
  labels:
    {{- include "eurag.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  serviceName: eurag-qdrant-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "eurag.qdrantSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eurag.qdrantSelector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          env:
            - name: QDRANT__TELEMETRY_DISABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.qdrant.storageClass }}
        resources:
          requests:
            storage: {{ .Values.qdrant.storage }}
