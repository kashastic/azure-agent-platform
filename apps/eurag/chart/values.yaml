image:
  # Set by the platform (registry login server + /eurag).
  repository: ""
  # Set per environment in values-<env>.yaml by the build pipeline.
  tag: ""
  pullPolicy: IfNotPresent

azure:
  # Set by the platform from Terraform outputs.
  tenantId: ""
  keyVaultName: ""
  workloadIdentityClientId: ""
  # Key Vault secret -> environment variable in the EURAG container.
  secrets:
    - keyVaultSecret: anthropic-api-key
      envName: ANTHROPIC_API_KEY
  # Added when public.hostname is set. The eurag-* ones are generated by the
  # foundation stack; the Turnstile pair is created by hand in Cloudflare.
  publicSecrets:
    - keyVaultSecret: eurag-jwt-secret
      envName: EURAG_JWT_SECRET
    - keyVaultSecret: eurag-encryption-key
      envName: EURAG_ENCRYPTION_KEY
    - keyVaultSecret: eurag-postgres-password
      envName: POSTGRES_PASSWORD
    - keyVaultSecret: eurag-redis-password
      envName: REDIS_PASSWORD
    - keyVaultSecret: turnstile-secret
      envName: EURAG_TURNSTILE_SECRET
    - keyVaultSecret: turnstile-sitekey
      envName: EURAG_TURNSTILE_SITEKEY

serviceAccount:
  # Must match the federated credential subject in infra/envs/dev/aks.
  name: eurag

eurag:
  # Fail loudly: an embedder that can't load its model crashes the pod
  # instead of silently falling back (see EURAG docs/DEPLOY.md).
  strictBoot: true
  # Caps reranker memory on the escalation path. EURAG measured ~1.6 GB
  # extra at batch 64, ~0.3 GB at 8, with identical accuracy.
  rerankBatch: 8
  # Extra EURAG_* settings, for example EURAG_LLM_MODEL: claude-haiku-4-5
  extraEnv: {}

seed:
  # First boot: scrape the official EU sources and embed them into Qdrant.
  # Later starts ingest the cache on the volume only (unchanged documents
  # are skipped), so they never need the network.
  enabled: true
  # Fail the seed unless at least this many documents were ingested.
  expectDocs: null
  # The seed runs before the API starts, so its peak never overlaps the
  # API's. Embedding the large acts (GDPR, the AI Act, the VAT Directive)
  # was OOM-killed at 2.5 GiB; EURAG's production seeder runs on a 4 GB host.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 4Gi

# Measured by EURAG: ~835 MB idle, ~1.8 GB answering, ~2.1 GB on the
# escalation path with rerankBatch 8. CPU is a small request with no limit:
# the node's managed add-ons already reserve most of its CPU for scheduling,
# and EURAG only needs CPU in short bursts while answering.
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    memory: 2560Mi

persistence:
  # Registry (SQLite), model cache. Azure Disk, so one node at a time.
  storageClass: managed-csi
  size: 5Gi

service:
  port: 8000

qdrant:
  # The unprivileged build runs as UID 1000. 1.20 matches EURAG's client.
  image: qdrant/qdrant:v1.20.0-unprivileged
  storageClass: managed-csi
  storage: 2Gi
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 1Gi

# Public mode: set public.hostname (the platform does) and EURAG runs as in
# its production compose: accounts in Postgres, rate limits in Redis, the
# Next.js web app, and the Gateway in front. Empty = private lab mode,
# reached only through kubectl port-forward.
public:
  hostname: ""
  gateway:
    name: public
    namespace: edge
  # Namespace that runs the gateway proxies; only it may reach the pods.
  edgeNamespace: edge
  freeAnonQuestions: 2
  freeUserQuestions: 10

# Corpus cache tarball in blob storage, restored on first boot through the
# workload identity (EUR-Lex refuses cloud IPs). Empty = scrape instead.
corpus:
  blobUrl: ""

web:
  image:
    repository: ""
    tag: ""
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi

postgres:
  image: postgres:16-alpine
  storageClass: managed-csi
  storage: 2Gi
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi

redis:
  image: redis:7.4-alpine
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Off on purpose. EURAG keeps its document registry in a per-instance
# SQLite file, so a second replica would answer from a different registry
# than the first. Turn this on once the registry moves to Postgres (EURAG
# already does this for auth and chat history).
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
