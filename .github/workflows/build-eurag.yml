name: build-eurag

# Builds EURAG's two images (API and Next.js web app) from its own
# repository at a pinned ref, pushes them to the platform registry, scans
# them, and only then commits the new tag to the dev values file. Argo CD
# notices the commit and rolls the deployment. CI never talks to the
# cluster, and an image with a fixable critical or high vulnerability is
# never deployed.
on:
  workflow_dispatch:
    inputs:
      eurag_ref:
        description: Branch, tag or commit of kashastic/eu-rag
        default: main
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: build-eurag
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/eurag
      WEB_IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/eurag-web
    steps:
      - uses: actions/checkout@v5

      - name: Check out EURAG
        uses: actions/checkout@v5
        with:
          repository: kashastic/eu-rag
          ref: ${{ inputs.eurag_ref }}
          path: src/eu-rag

      # The tag is the EURAG commit, so every running image traces back to
      # exact source.
      - name: Image tag
        id: meta
        run: echo "tag=$(git -C src/eu-rag rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # The build identity only holds AcrPush on the registry, so it has no
      # subscription to select.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_BUILD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Exchange the Entra ID token for a registry token. This needs only the
      # AcrPush data-plane role; the registry has no admin password.
      - name: Log in to the registry
        env:
          REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
        run: |
          aad_token=$(az account get-access-token --query accessToken -o tsv)
          acr_token=$(curl -fsS -X POST "https://$REGISTRY/oauth2/exchange" \
            --data-urlencode "grant_type=access_token" \
            --data-urlencode "service=$REGISTRY" \
            --data-urlencode "access_token=$aad_token" | jq -r .refresh_token)
          echo "$acr_token" | docker login "$REGISTRY" \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin

      - uses: docker/setup-buildx-action@v3

      # linux/amd64 because AKS nodes are x86_64 (EURAG's own images were
      # built on an arm64 Mac).
      - name: Build and push the API
        uses: docker/build-push-action@v6
        with:
          context: src/eu-rag
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the web app
        uses: docker/build-push-action@v6
        with:
          context: src/eu-rag/frontend/web
          platforms: linux/amd64
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Gate: fail on any critical or high vulnerability that has a fix.
      # The tag is only committed below if both images pass, so a failing
      # image sits in the registry but never reaches the cluster.
      - name: Scan both images
        run: |
          failed=0
          for ref in "$IMAGE:${{ steps.meta.outputs.tag }}" "$WEB_IMAGE:${{ steps.meta.outputs.tag }}"; do
            echo "::group::trivy $ref"
            docker run --rm -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
              aquasec/trivy:latest image --no-progress --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 "$ref" || { failed=1; echo "::error::$ref has fixable critical or high vulnerabilities"; }
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Commit the new tag for Argo CD
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          yq -i '.image.tag = strenv(TAG) | .web.image.tag = strenv(TAG)' apps/eurag/chart/values-dev.yaml
          if git diff --quiet; then
            echo "values-dev.yaml already points at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "eurag: deploy $TAG to dev"
          git push
