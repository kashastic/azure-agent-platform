# Let's Encrypt over HTTP-01: cert-manager answers the challenge with a
# temporary HTTPRoute on the Gateway's plain-HTTP listener.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: {{ .Values.acme.server | quote }}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: public
                namespace: {{ .Release.Namespace }}
                sectionName: http
